<title>Locked</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width app column on a pastel gradient — frosted search bar on top, content scroll, floating frosted tab bar with a gradient plus. Soft Glass, light only by design. */
:root{
  --bg:#F3F0FF; --grad:linear-gradient(160deg,#FDF0FF 0%,#EEF3FF 45%,#E9FFF7 100%); --surface:rgba(255,255,255,.74); --solid:#FFFFFF; --surface-2:rgba(123,92,255,.07); --line:rgba(120,110,200,.16); --glass-edge:rgba(255,255,255,.9);
  --ink:#1E1B3A; --ink-2:#4B4870; --muted:#8C88AC;
  --blue:#7B5CFF; --blue-ink:#5636D9; --blue-soft:#EDE8FF; --grad-accent:linear-gradient(135deg,#FF7AC6,#7B5CFF 55%,#3DD6C4);
  --coral:#FF5FB7; --coral-soft:#FFE6F4;
  --sun:#FFB547; --sun-soft:#FFF1DA;
  --mint:#1FB8A3; --mint-soft:#DAF7F2;
  --danger:#E5374F; --danger-soft:#FDE4E8;
  --night:#14112B;
  --f-display:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; --r-sm:14px;
  --shadow:0 10px 30px rgba(123,92,255,.12);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg) var(--grad) fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#FDF0FF}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px} .tiny{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--grad);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--glass-edge);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border:1px solid var(--glass-edge);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:14px;text-align:left}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.tabbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-edge);border-radius:28px;box-shadow:0 12px 32px rgba(123,92,255,.18);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue)}
.plus{justify-self:center;width:54px;height:54px;border-radius:20px;background:var(--grad-accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(123,92,255,.4);transition:transform .15s}
.plus:active{transform:scale(.94)}
.plus svg{width:28px;height:28px}

.seg{display:flex;gap:4px;background:rgba(255,255,255,.5);border:1px solid var(--glass-edge);padding:4px;border-radius:16px}
.seg button{flex:1;padding:8px 10px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--solid);color:var(--blue-ink);box-shadow:0 4px 12px rgba(123,92,255,.14)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.chip.coral{background:var(--coral-soft);color:#B8321A}
.chip.mint{background:var(--mint-soft);color:#08744F}
.chip.sun{background:var(--sun-soft);color:#8A5A00}
.chip.gray{background:var(--surface-2);color:var(--ink-2)}
.chip.sel{background:var(--blue);color:#fff}
button.chip{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;background:var(--grad-accent);color:#fff;box-shadow:0 6px 16px rgba(123,92,255,.25);transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--blue-ink);box-shadow:none;border:1px solid var(--glass-edge)}
.btn.line{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.coral{background:linear-gradient(135deg,#FF7AC6,#FF9E7A)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.85);font-size:15px}
.input:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
textarea.input{resize:vertical;min-height:70px}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display)}
.avs{display:flex}.avs .av{border:2px solid var(--surface);margin-left:-8px}.avs .av:first-child{margin-left:0}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px}
.banner.sun{background:var(--sun-soft);color:#6E4800}
.banner.blue{background:var(--blue-soft);color:var(--blue-ink)}
.banner.danger{background:var(--danger-soft);color:#8E1426}
.banner.mint{background:var(--mint-soft);color:#075E41}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle.on{background:var(--blue)}
.toggle.on::after{transform:translateX(18px)}

/* feed */
.post{background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.post>.player{width:calc(100% - 16px);margin:0 8px;border-radius:20px}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-h .name{font-weight:700;font-size:14.5px}
.player{position:relative;background:var(--night);aspect-ratio:3/4;max-width:100%;width:100%;overflow:hidden}
.player canvas{width:100%;height:100%;display:block}
.player .pp{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;color:#fff}
.player.paused .pp{opacity:1;background:rgba(0,0,0,.25)}
.post-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 4px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600}
.post-b{padding:6px 14px 12px;display:flex;flex-direction:column;gap:8px}
.post-a{display:flex;gap:4px;padding:4px 8px 10px;border-top:1px solid var(--line)}
.post-a button{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.post-a button:hover{background:var(--surface-2)}
.post-a button.on{color:var(--blue);}
.post-a button.on svg{fill:var(--blue-soft)}
.song{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:linear-gradient(90deg,rgba(255,122,198,.14),rgba(61,214,196,.14));font-size:13px}
.song .art{width:34px;height:34px;border-radius:8px;flex:none}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--blue);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.reelcta{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(255,122,198,.2),rgba(61,214,196,.2));border:1px solid var(--glass-edge);text-align:left;width:100%}

/* sheets & layers */
.scrim{position:fixed;inset:0;background:rgba(12,14,34,.42);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:480px;max-height:88%;overflow-y:auto;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.layer{position:absolute;inset:0;z-index:50;background:var(--grad);display:flex;flex-direction:column;animation:fade .15s}
.layer-h{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--glass-edge)}
.layer-h h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-b{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:90;max-width:90%;text-align:center;animation:up .2s}

/* session */
.session{position:absolute;inset:0;z-index:55;background:#000;color:#C9CCE0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px))}
.session .clock{font-family:var(--f-mono);font-size:44px;font-weight:700;color:#E8EAF6;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.session .sbtn{padding:12px 18px;border-radius:14px;background:#15172B;color:#E8EAF6;font-weight:700;font-size:14px;border:1px solid #23264A}
.session .sbtn.end{background:var(--blue);border-color:var(--blue);color:#fff}
.session .sbtn.em{background:transparent;border-color:#4A2030;color:#FF8A9C}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8F93B8}
.rec i{width:8px;height:8px;border-radius:50%;background:#FF3B4E;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.sgoal{display:flex;align-items:center;gap:10px;padding:8px 2px;color:#C9CCE0;font-size:14px;text-align:left;width:100%}
.sgoal .box{width:20px;height:20px;border-radius:6px;border:2px solid #3A3E6A;flex:none;display:grid;place-items:center}
.sgoal.done .box{background:var(--mint);border-color:var(--mint)}
.sgoal.done span{text-decoration:line-through;color:#6F7398}

/* map */
.mapwrap{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--glass-edge);box-shadow:var(--shadow);background:#F3F0FB;aspect-ratio:1/1.08;max-width:100%}
.mapwrap svg,.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.mapwrap canvas{pointer-events:none;mix-blend-mode:multiply}
.legend-ramp{height:8px;border-radius:4px;background:linear-gradient(90deg,#C9DAFF,#A18CFF,#7B5CFF,#FF7AC6,#FF4F8E)}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{r:7;opacity:.9}100%{r:22;opacity:0}}

/* chat */
.msg{max-width:80%;padding:9px 12px;border-radius:18px;font-size:14.5px;background:rgba(255,255,255,.85);border:1px solid var(--glass-edge);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#8E6BFF,#7B5CFF);color:#fff;border-color:transparent}
.msgmeta{font-size:11px;color:var(--muted);margin:0 6px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--glass-edge)}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left;border-radius:12px}
button.listrow:hover{background:var(--surface-2)}

/* stats */
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr 36px;gap:10px;align-items:center;font-size:13px}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bartrack{height:14px;border-radius:0 4px 4px 0;position:relative}
.barfill{height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.barrow .val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.vbars .vb{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.vbars .vb.dim{background:var(--blue-soft)}
.vbars .vb:hover{filter:brightness(1.12)}
.tip{position:fixed;z-index:95;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--glass-edge);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,5vw,22px);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.flowhero{background:radial-gradient(110% 80% at 50% 0%,rgba(255,200,107,.35) 0%,rgba(255,122,198,.12) 45%,rgba(255,255,255,.7) 75%);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:28px;padding:18px;text-align:center}
.flame{animation:flick 1.3s infinite alternate ease-in-out;transform-origin:50% 100%}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.92,1.08)}100%{transform:scale(1.05,.95)}}
.spin{animation:spin 18s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 1.8s infinite}
@keyframes tw{50%{opacity:.15}}

/* reels */
.reels{position:absolute;inset:0;z-index:58;background:#000;color:#fff;display:flex;flex-direction:column}
.reels .seg button{color:#fff}.reels .seg button.on{background:#fff;color:#121430}
.reel-feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;position:relative}
.reel canvas{width:100%;height:100%;display:block}
.reel .cap{position:absolute;left:16px;right:70px;bottom:24px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.reel .side{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:12px;font-weight:700}
.reel .side button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}

/* wrapped */
.story{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 30px}
.story .bars2{display:flex;gap:4px}.story .bars2 i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.story .bars2 i.on{background:#fff}
.story .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
