<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: one phone-width app column — sticky search bar on top, content scroll, fixed five-slot tab bar with a raised plus. Light only, by design. */
:root{
  --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EEF1FA; --line:#E2E6F2;
  --ink:#121430; --ink-2:#464B6E; --muted:#868BA8;
  --blue:#2D5BFF; --blue-ink:#1838C8; --blue-soft:#E4EBFF;
  --coral:#FF5B3A; --coral-soft:#FFE7E0;
  --sun:#FFB81F; --sun-soft:#FFF3D6;
  --mint:#10B27F; --mint-soft:#DDF6EC;
  --danger:#E5374F; --danger-soft:#FDE4E8;
  --night:#0B0D1E;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(18,20,48,.06),0 8px 24px rgba(18,20,48,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px} .tiny{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:9px 14px;color:var(--muted);font-size:14px;text-align:left}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue)}
.plus{justify-self:center;width:58px;height:58px;margin-top:-26px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(45,91,255,.38);transition:transform .15s}
.plus:active{transform:scale(.94)}
.plus svg{width:28px;height:28px}

.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(18,20,48,.1)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.chip.coral{background:var(--coral-soft);color:#B8321A}
.chip.mint{background:var(--mint-soft);color:#08744F}
.chip.sun{background:var(--sun-soft);color:#8A5A00}
.chip.gray{background:var(--surface-2);color:var(--ink-2)}
.chip.sel{background:var(--blue);color:#fff}
button.chip{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--blue);color:#fff;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.coral{background:var(--coral)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.input:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
textarea.input{resize:vertical;min-height:70px}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display)}
.avs{display:flex}.avs .av{border:2px solid var(--surface);margin-left:-8px}.avs .av:first-child{margin-left:0}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px}
.banner.sun{background:var(--sun-soft);color:#6E4800}
.banner.blue{background:var(--blue-soft);color:var(--blue-ink)}
.banner.danger{background:var(--danger-soft);color:#8E1426}
.banner.mint{background:var(--mint-soft);color:#075E41}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle.on{background:var(--blue)}
.toggle.on::after{transform:translateX(18px)}

/* feed */
.post{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-h .name{font-weight:700;font-size:14.5px}
.player{position:relative;background:var(--night);aspect-ratio:3/4;max-width:100%;width:100%;overflow:hidden}
.player canvas{width:100%;height:100%;display:block}
.player .pp{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;color:#fff}
.player.paused .pp{opacity:1;background:rgba(0,0,0,.25)}
.post-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 4px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600}
.post-b{padding:6px 14px 12px;display:flex;flex-direction:column;gap:8px}
.post-a{display:flex;gap:4px;padding:4px 8px 10px;border-top:1px solid var(--line)}
.post-a button{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.post-a button:hover{background:var(--surface-2)}
.post-a button.on{color:var(--sun);}
.post-a button.on svg{fill:var(--sun)}
.song{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13px}
.song .art{width:34px;height:34px;border-radius:8px;flex:none}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--blue);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.reelcta{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,#FFE7E0,#FFF3D6);text-align:left;width:100%}

/* sheets & layers */
.scrim{position:fixed;inset:0;background:rgba(12,14,34,.42);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:480px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.layer{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fade .15s}
.layer-h{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.layer-h h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-b{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:90;max-width:90%;text-align:center;animation:up .2s}

/* session */
.session{position:absolute;inset:0;z-index:55;background:#000;color:#C9CCE0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px))}
.session .clock{font-family:var(--f-mono);font-size:44px;font-weight:700;color:#E8EAF6;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.session .sbtn{padding:12px 18px;border-radius:14px;background:#15172B;color:#E8EAF6;font-weight:700;font-size:14px;border:1px solid #23264A}
.session .sbtn.end{background:var(--blue);border-color:var(--blue);color:#fff}
.session .sbtn.em{background:transparent;border-color:#4A2030;color:#FF8A9C}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8F93B8}
.rec i{width:8px;height:8px;border-radius:50%;background:#FF3B4E;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.sgoal{display:flex;align-items:center;gap:10px;padding:8px 2px;color:#C9CCE0;font-size:14px;text-align:left;width:100%}
.sgoal .box{width:20px;height:20px;border-radius:6px;border:2px solid #3A3E6A;flex:none;display:grid;place-items:center}
.sgoal.done .box{background:var(--mint);border-color:var(--mint)}
.sgoal.done span{text-decoration:line-through;color:#6F7398}

/* map */
.mapwrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#EAF0E6;aspect-ratio:1/1.08;max-width:100%}
.mapwrap svg,.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.mapwrap canvas{pointer-events:none;mix-blend-mode:multiply}
.legend-ramp{height:8px;border-radius:4px;background:linear-gradient(90deg,#BFD3FF,#6E8BFF,#FFB81F,#FF5B3A,#D3143A)}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{r:7;opacity:.9}100%{r:22;opacity:0}}

/* chat */
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14.5px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}
.msgmeta{font-size:11px;color:var(--muted);margin:0 6px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left;border-radius:12px}
button.listrow:hover{background:var(--surface-2)}

/* stats */
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr 36px;gap:10px;align-items:center;font-size:13px}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bartrack{height:14px;border-radius:0 4px 4px 0;position:relative}
.barfill{height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.barrow .val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.vbars .vb{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.vbars .vb.dim{background:var(--blue-soft)}
.vbars .vb:hover{filter:brightness(1.12)}
.tip{position:fixed;z-index:95;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,5vw,22px);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.flowhero{background:radial-gradient(120% 90% at 50% 0%,#FFF3D6 0%,#FFFFFF 60%);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.flame{animation:flick 1.3s infinite alternate ease-in-out;transform-origin:50% 100%}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.92,1.08)}100%{transform:scale(1.05,.95)}}
.spin{animation:spin 18s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 1.8s infinite}
@keyframes tw{50%{opacity:.15}}

/* reels */
.reels{position:absolute;inset:0;z-index:58;background:#000;color:#fff;display:flex;flex-direction:column}
.reels .seg button{color:#fff}.reels .seg button.on{background:#fff;color:#121430}
.reel-feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;position:relative}
.reel canvas{width:100%;height:100%;display:block}
.reel .cap{position:absolute;left:16px;right:70px;bottom:24px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.reel .side{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:12px;font-weight:700}
.reel .side button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}

/* wrapped */
.story{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 30px}
.story .bars2{display:flex;gap:4px}.story .bars2 i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.story .bars2 i.on{background:#fff}
.story .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>

// ---------- Content safety ----------
// Every caption, comment, chat message and Reel title goes through moderate() before it is
// shown to anyone. Production adds a server-side moderation model plus image checks
// (Apple's on-device Sensitive Content Analysis on iPhone, then a server scan of the video).
const MOD_RULES = [
  { cat: "Harassment or self-harm", lvl: "block", re: /\b(kys|kill (your|ur)self|go die|you should die|nobody likes you)\b/ },
  { cat: "Sexual content", lvl: "block", re: /\b(nudes?|porn\w*|onlyfans|send pics|sexting)\b/ },
  { cat: "Profanity or slurs", lvl: "block", re: /\b(f+u+c+k+\w*|sh+i+t+\w*|bitch\w*|cunt\w*|whore|slut|retard\w*)\b/ },
  { cat: "Selling drugs", lvl: "block", re: /\b(selling|sell|buy|dm for|got) (adderall|addy|xanax|molly|coke|percs?|ritalin)\b/ },
  { cat: "Threats or violence", lvl: "block", re: /\b(shoot (up|this)|bomb (the|this)|i('| wi)ll hurt)\b/ },
  { cat: "Possible Honor Code issue", lvl: "warn", re: /\b(answers? (to|for) (the )?(midterm|final|exam|quiz|pset|problem set)|pset solutions?|exam answers?|send (me )?(your|the) (code|solutions?))\b/ },
  { cat: "Personal info", lvl: "warn", re: /(\b\d{3}[-. ]?\d{3}[-. ]?\d{4}\b)|(\b[\w.+-]+@[\w-]+\.[\w.]+\b)/ },
];
function normalizeText(t) { return t.toLowerCase().replace(/[0]/g, "o").replace(/[1!|]/g, "i").replace(/3/g, "e").replace(/[4@]/g, "a").replace(/[5$]/g, "s").replace(/7/g, "t").replace(/(.)\1{2,}/g, "$1$1") }
function moderate(text) {
  if (!text || !text.trim()) return { lvl: "ok", hits: [] };
  const raw = text.toLowerCase(), norm = normalizeText(text), squash = norm.replace(/[\s._*-]+/g, " ");
  const hits = MOD_RULES.filter(r => r.re.test(raw) || r.re.test(norm) || r.re.test(squash));
  const lvl = hits.some(h => h.lvl === "block") ? "block" : hits.length ? "warn" : "ok";
  return { lvl, hits: hits.map(h => h.cat) };
}
function modMessage(m) {
  if (m.lvl === "block") return `This can't be posted: ${m.hits.filter((_, i) => i < 2).join(", ").toLowerCase()}. Locked keeps the feed safe for everyone. Edit it and try again.`;
  if (m.lvl === "warn") return `Heads up: ${m.hits.join(", ").toLowerCase()}. ${m.hits.includes("Possible Honor Code issue") ? "Sharing graded answers can violate the Stanford Honor Code." : "Think twice before sharing contact details publicly."}`;
  return "";
}
// Quick image check on captured frames. Production uses a trained model; the demo checks that
// the camera wasn't covered and samples frames for a large share of skin-like pixels.
function scanFrames(frames) {
  const c = document.createElement("canvas"); c.width = 24; c.height = 32; const x = c.getContext("2d", { willReadFrequently: true });
  let dark = 0, skinHeavy = 0, n = 0;
  const sample = frames.filter(f => f && f.img).filter((_, i, a) => i % Math.max(1, Math.floor(a.length / 24)) === 0);
  for (const f of sample) {
    try { x.drawImage(f.img, 0, 0, 24, 32) } catch { continue }
    const d = x.getImageData(0, 0, 24, 32).data; let lum = 0, skin = 0;
    for (let i = 0; i < d.length; i += 4) { const r = d[i], g = d[i + 1], b = d[i + 2]; lum += (r + g + b) / 3; if (r > 95 && g > 40 && b > 20 && r > g && r > b && r - Math.min(g, b) > 15) skin++ }
    n++; if (lum / (d.length / 4) < 12) dark++; if (skin / (d.length / 4) > .72) skinHeavy++;
  }
  return { n, flagged: n > 0 && skinHeavy / n > .5, covered: n > 0 && dark / n > .8 };
}

// ---------- Generative timelapse scene (used for friends' posts and when no camera is available) ----------
function sceneDraw(ctx, w, h, t, seed, startTs, durMs) {
  const r = rng(seed); const skin = ["#F2C9A0", "#C68E62", "#8D5A3B", "#E8B48A", "#5E3B28"][seed % 5];
  const shirt = ["#2D5BFF", "#FF5B3A", "#10B27F", "#A24BFF", "#FFB81F", "#0FA3C9"][seed % 6];

  // wall

  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = w * .012; ctx.strokeRect(wx, wy, ww, wh); ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.stroke();
  // lamp glow at night
  if (day < .4) { const g = ctx.createRadialGradient(w * .2, h * .55, 5, w * .2, h * .55, w * .6); g.addColorStop(0, `rgba(255,210,120,${.45 * (1 - day / .4)})`); g.addColorStop(1, "rgba(255,210,120,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h) }
  // shelf + books
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(w * .05, h * .3, w * .4, h * .015);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = ["#FF5B3A", "#2D5BFF", "#FFB81F", "#10B27F", "#A24BFF", "#fff"][(i + seed) % 6]; const bh = h * (.06 + r() * .04); ctx.fillRect(w * .07 + i * w * .055, h * .3 - bh, w * .045, bh) }
  // person (bobbing / leaning, presence gaps when away)
  const away = (Math.sin(t * 31 + seed) > .985);
  const lean = Math.sin(t * 55 + seed) * w * .02 + (jr() - .5) * w * .03;
  const cx = w * .42 + lean, cy = h * .5 + (jr() - .5) * h * .015;
  if (!away) {
    ctx.fillStyle = shirt; ctx.beginPath(); ctx.ellipse(cx, cy + h * .2, w * .22, h * .16, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(cx - w * .22, cy + h * .2, w * .44, h * .1);
    ctx.fillStyle = skin; ctx.fillRect(cx - w * .04, cy + h * .02, w * .08, h * .06);
    ctx.beginPath(); ctx.ellipse(cx, cy - h * .03, w * .1, h * .085, 0, 0, 7); ctx.fill();
    ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(cx, cy - h * .075, w * .108, h * .055, 0, Math.PI, 0); ctx.fill();
    // headphones some of the time
    if (seed % 3 === 0) { ctx.strokeStyle = "#222"; ctx.lineWidth = w * .018; ctx.beginPath(); ctx.arc(cx, cy - h * .04, w * .115, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke() }
    // arm writing
    const ax = cx + w * .1 + Math.sin(t * 900 + seed) * w * .04;
    ctx.strokeStyle = shirt; ctx.lineWidth = w * .07; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(cx + w * .15, cy + h * .14); ctx.lineTo(ax, cy + h * .28); ctx.stroke();
  }
  // desk
  ctx.fillStyle = "#B9835A"; ctx.fillRect(0, h * .78, w, h * .22); ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.fillRect(0, h * .78, w, h * .012);
  // laptop
  ctx.fillStyle = "#C9CEDB"; ctx.fillRect(w * .58, h * .66, w * .3, h * .12); ctx.fillStyle = "#AEB4C5"; ctx.fillRect(w * .55, h * .78, w * .36, h * .015);
  ctx.fillStyle = day < .4 ? "rgba(160,200,255,.9)" : "#E6EEFF"; ctx.fillRect(w * .6, h * .675, w * .26, h * .095);

  ctx.save(); ctx.translate(w * .2, h * .86); ctx.rotate(-.12 + (jr() - .5) * .05); ctx.fillStyle = "#fff"; ctx.fillRect(-w * .12, -h * .04, w * .24, h * .07); ctx.restore();
  ctx.fillStyle = ["#FF5B3A", "#2D5BFF", "#10B27F"][seed % 3]; ctx.fillRect(w * .07, h * .73, w * .065, h * .07);
}
// Overlay drawn on every timelapse: clock, elapsed, class tag, song.

// ---------- Players: one animation loop drives every visible timelapse ----------
const PLAYERS = new Map(); let playerSeq = 0;

}

// ---------- Study score ----------
// Lock Score (0–100) measures quality only. Length is reported separately as Locked time.
//   Presence 45%   share of checks where you were at your desk (micro-motion required, so a photo or empty chair fails)
//   Continuity 30% starts at 100: free pause = under 10 min, one per started hour; extra short pause −8, long pause −12,
//                  leaving the app −5, emergency unlock −20
//   Goals 25%      share of the goals you set before starting that you checked off
// If you set no goals, presence and continuity are reweighted to 60/40.
function scoreSession(s) {
  const activeMin = s.activeMs / MIN, hours = Math.max(1, Math.ceil(activeMin / 60));
  const presence = s.checks ? s.present / s.checks : 1;
  let cont = 100, free = hours; const notes = [];
  for (const p of s.pauses) {
    const m = ((p.end || s.endAt) - p.start) / MIN * s.speed;
    if (m < 10 && free > 0) { free--; notes.push(`Pause ${Math.round(m)} min: free (1 per hour)`) }
    else if (m < 10) { cont -= 8; notes.push(`Extra short pause: −8`) }
    else { cont -= 12; notes.push(`Pause over 10 min: −12`) }
  }
  if (s.leftApp) { cont -= 5 * s.leftApp; notes.push(`Left the app ${s.leftApp}×: −${5 * s.leftApp}`) }
  if (s.emergency) { cont -= 20 * s.emergency; notes.push(`Emergency unlock: −${20 * s.emergency}`) }
  cont = clamp(cont, 0, 100);
  const total = s.goals.length, done = s.goals.filter(g => g.done).length, goals = total ? done / total : null;
  const score = goals === null ? Math.round(.6 * presence * 100 + .4 * cont) : Math.round(.45 * presence * 100 + .30 * cont + .25 * goals * 100);
  return { score: clamp(score, 0, 100), presence, cont, goals, done, total, notes };
}

// ---------- Session engine ----------
let S = null, tickTimer = null, wakeLock = null;

const tiny = document.createElement("canvas"); tiny.width = 16; tiny.height = 20; const tinyx = tiny.getContext("2d", { willReadFrequently: true });
const MAX_FRAMES = 480;

    frames: [], interval: 2500, lastCap: 0, checks: 0, present: 0, prevSig: null, stillRun: 0, speed: draft.fast ? 60 : 1, nextBreakAt: 60, cam: null, video: null, seed: Math.floor(Math.random() * 1e6),

  } catch { S.cam = null; toast("Camera isn't available here, so this demo uses a simulated camera") }

};
function sessionNow() { return S.startAt + (Date.now() - S.startAt) * S.speed } // the "clock" in demo mode runs 60× fast

    if (S.activeMs / MIN >= S.nextBreakAt) { S.nextBreakAt += 60; S.breakOffer = true }
  } else if (S.mode === "paused") {
    const p = S.pauses[S.pauses.length - 1]; if ((now - p.start) * S.speed >= 30 * MIN) { p.end = now; S.autoEnded = true; endSession(); return }
  } else if (S.mode === "break") {

  }

}

function reelDraw(x, w, h, t, seed) {

  x.fillStyle = "#F2C9A0"; x.beginPath(); x.arc(bx, by, 52, 0, 7); x.fill();
  x.fillStyle = "#121430"; x.beginPath(); x.arc(bx - 18, by - 6, 6, 0, 7); x.arc(bx + 18, by - 6, 6, 0, 7); x.fill();
  x.strokeStyle = "#121430"; x.lineWidth = 5; x.beginPath(); x.arc(bx, by + 12, 18, .15 * Math.PI, .85 * Math.PI); x.stroke();

  x.beginPath(); x.moveTo(bx - 60, by + 90); x.lineTo(bx - 110, by + 30 + wave * 40); x.stroke(); x.beginPath(); x.moveTo(bx + 60, by + 90); x.lineTo(bx + 110, by + 30 - wave * 40); x.stroke();
}
async function recordReel() {
  const prompt = REEL_PROMPTS[new Date().getDate() % REEL_PROMPTS.length];
  const sh = openSheet(`<h3 style="font-size:19px">Today's prompt</h3><div style="font-family:var(--f-display);font-weight:800;font-size:22px;margin:6px 0 12px">${esc(prompt)}</div><div id="rr" class="stack"><div class="small muted">Up to 20 seconds. Clips are checked automatically before anyone sees them.</div><button class="btn coral block" id="rgo">Start recording</button><label class="btn line block" for="rfile">Or upload a clip<input type="file" id="rfile" accept="video/*" hidden></label></div>`);
  const done = () => { closeSheet(); state.myReels = [...(state.myReels || []), { p: prompt, uid: "me", seed: 99, keys: 0 }]; toast("Clip passed the safety check and was posted to Reels") };
  $("#rfile", sh).onchange = e => { if (e.target.files[0]) { if (e.target.files[0].size > 60e6) { toast("That clip is too long. Keep it under 20 seconds."); return } done() } };
  $("#rgo", sh).onclick = async () => {
    let stream; try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }) } catch { $("#rr", sh).innerHTML = `<div class="banner sun">The camera isn't available in this preview. Upload a clip instead, or open the app on your phone.</div>`; return }
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.srcObject = stream; v.style.cssText = "width:100%;border-radius:14px;transform:scaleX(-1)"; await v.play();
    const box = $("#rr", sh); box.innerHTML = ""; box.appendChild(v); const lbl = document.createElement("div"); lbl.className = "mono"; box.appendChild(lbl);
    let left = 20; lbl.textContent = "Recording · 0:20"; const stopBtn = document.createElement("button"); stopBtn.className = "btn block"; stopBtn.textContent = "Stop"; box.appendChild(stopBtn);
    const iv = setInterval(() => { left--; lbl.textContent = "Recording · 0:" + String(left).padStart(2, "0"); if (left <= 0) fin() }, 1000);
    const fin = () => { clearInterval(iv); stream.getTracks().forEach(t => t.stop()); done() }; stopBtn.onclick = fin;
  };
}

// ---------- Boot ----------
(async function boot() {
  const saved = await idb.all();
  state.myPosts = saved.sort((a, b) => b.end - a.end).map(p => ({ ...p, frames: framesFromData(p.frameData || []) }));
  setTab("feed");
})();
</script>
